<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>STEMBridge Speaks — Dictionary</title>
    <meta
      name="description"
      content="Free multilingual dictionary — look up word meanings, examples, and pronunciation in German, English, Spanish, Mandarin, Russian, and Arabic."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #1b4332;
        --forest-dark: #12301f;
        --gold: #e8a33d;
        --cream: #fbf7ee;
        --sage: #e3eae0;
        --ink: #22281e;
        --brick: #8c4a3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "Work Sans", sans-serif;
        line-height: 1.55;
      }
      h1,
      h2,
      h3 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        color: var(--forest-dark);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 6vw;
        border-bottom: 1px solid rgba(27, 67, 50, 0.1);
        flex-wrap: wrap;
        gap: 10px;
      }
      .logo {
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 19px;
        color: var(--forest);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
      }
      nav a.btn {
        background: var(--forest);
        color: var(--cream) !important;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: 600;
      }

      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 6vw 80px;
      }

      .search-row {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      #wordInput {
        flex: 1;
        min-width: 180px;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1.5px solid rgba(27, 67, 50, 0.25);
        font-size: 15px;
        font-family: "Work Sans", sans-serif;
      }
      #langSelect {
        padding: 12px 14px;
        border-radius: 8px;
        border: 1.5px solid rgba(27, 67, 50, 0.25);
        background: var(--sage);
        font-size: 14px;
      }
      #searchBtn {
        padding: 12px 22px;
        border-radius: 8px;
        border: none;
        background: var(--forest);
        color: var(--cream);
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
      }
      #searchBtn:hover {
        background: var(--forest-dark);
      }
      #searchBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #resultCard {
        margin-top: 28px;
        background: var(--sage);
        border-radius: 14px;
        padding: 26px;
        display: none;
      }
      #resultCard.show {
        display: block;
      }
      .word-row {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
      }
      .word-row h2 {
        margin: 0;
        font-size: 26px;
      }
      .pos-tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        background: var(--forest-dark);
        color: var(--cream);
        padding: 4px 10px;
        border-radius: 20px;
        margin-top: 4px;
        display: inline-block;
      }
      #playBtn {
        background: var(--gold);
        color: var(--forest-dark);
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #playBtn.loading {
        animation: pulse 0.9s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      .definition {
        margin-top: 14px;
        font-size: 15.5px;
      }
      .example-box {
        margin-top: 16px;
        background: var(--cream);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .example-box .ex-original {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14.5px;
      }
      .example-box .ex-translation {
        font-size: 13px;
        color: #55594a;
        margin-top: 6px;
      }
      .notes {
        margin-top: 14px;
        font-size: 13.5px;
        color: var(--brick);
        font-style: italic;
      }

      #loadingMsg {
        margin-top: 24px;
        color: #6b7062;
        font-size: 14px;
        display: none;
      }
      #loadingMsg.show {
        display: block;
      }
      #errorMsg {
        margin-top: 24px;
        color: var(--brick);
        font-size: 14px;
        display: none;
      }
      #errorMsg.show {
        display: block;
      }

      .recent-section {
        margin-top: 36px;
      }
      .recent-section h3 {
        font-size: 15px;
        margin-bottom: 10px;
      }
      .recent-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .recent-chip {
        background: var(--sage);
        border: none;
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: "Work Sans", sans-serif;
      }
      .recent-chip:hover {
        background: var(--gold);
      }

      footer {
        margin-top: 40px;
        padding: 32px 6vw;
        text-align: center;
        font-size: 13px;
        color: #6b7062;
        border-top: 1px solid rgba(27, 67, 50, 0.1);
      }
      footer a {
        margin: 0 10px;
        color: var(--forest-dark);
      }

      @media (max-width: 600px) {
        header {
          padding: 16px 5vw;
        }
        nav a:not(.btn) {
          display: none;
        }
        main {
          padding: 28px 5vw 60px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo">STEMBridge Speaks</a>
      <nav>
        <a href="/practice.html">Conversation Practice</a>
        <a href="/learn.html">Learn Grammar</a>
        <a href="/practice.html" class="btn">Practice free</a>
      </nav>
    </header>

    <main>
      <h1>Dictionary</h1>
      <p>
        Look up any word — get a clear definition, an example sentence, and hear
        it pronounced.
      </p>

      <div class="search-row">
        <input type="text" id="wordInput" placeholder="Type a word..." />
        <select id="langSelect">
          <option value="german">🇩🇪 German</option>
          <option value="english">🇬🇧 English</option>
          <option value="spanish">🇪🇸 Spanish</option>
          <option value="mandarin">🇨🇳 Mandarin</option>
          <option value="russian">🇷🇺 Russian</option>
          <option value="arabic">🇸🇦 Arabic</option>
        </select>
        <button id="searchBtn">Search</button>
      </div>

      <p id="loadingMsg">Looking that up...</p>
      <p id="errorMsg"></p>

      <div id="resultCard">
        <div class="word-row">
          <div>
            <h2 id="resultWord"></h2>
            <span class="pos-tag" id="resultPos"></span>
          </div>
          <button id="playBtn" title="Hear pronunciation">🔊</button>
        </div>
        <p class="definition" id="resultDefinition"></p>
        <div class="example-box" id="exampleBox" style="display: none">
          <div class="ex-original" id="exampleOriginal"></div>
          <div class="ex-translation" id="exampleTranslation"></div>
        </div>
        <p class="notes" id="resultNotes" style="display: none"></p>
      </div>

      <div class="recent-section" id="recentSection" style="display: none">
        <h3>Recent searches</h3>
        <div class="recent-list" id="recentList"></div>
      </div>
    </main>

    <footer>
      © 2026 STEMBridge Speaks
      <div style="margin-top: 6px">
        <a href="/learn.html">Learn Grammar</a>
        <a href="/practice.html">Conversation Practice</a>
        <a href="/about.html">About</a>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/contact.html">Contact</a>
      </div>
    </footer>

    <script>
      const wordInput = document.getElementById("wordInput");
      const langSelect = document.getElementById("langSelect");
      const searchBtn = document.getElementById("searchBtn");
      const resultCard = document.getElementById("resultCard");
      const loadingMsg = document.getElementById("loadingMsg");
      const errorMsg = document.getElementById("errorMsg");
      const playBtn = document.getElementById("playBtn");
      let lastLookup = null;

      function getRecent() {
        try {
          return (
            JSON.parse(localStorage.getItem("stembridge_recent_words")) || []
          );
        } catch {
          return [];
        }
      }
      function saveRecent(word, lang) {
        let recent = getRecent().filter(
          (r) => !(r.word === word && r.lang === lang),
        );
        recent.unshift({ word, lang });
        recent = recent.slice(0, 15);
        localStorage.setItem("stembridge_recent_words", JSON.stringify(recent));
        renderRecent();
      }
      function renderRecent() {
        const recent = getRecent();
        const section = document.getElementById("recentSection");
        const list = document.getElementById("recentList");
        if (recent.length === 0) {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        list.innerHTML = "";
        recent.forEach((r) => {
          const chip = document.createElement("button");
          chip.className = "recent-chip";
          chip.textContent = r.word;
          chip.addEventListener("click", () => {
            wordInput.value = r.word;
            langSelect.value = r.lang;
            search();
          });
          list.appendChild(chip);
        });
      }

      async function search() {
        const word = wordInput.value.trim();
        if (!word) return;
        const language = langSelect.value;

        resultCard.classList.remove("show");
        errorMsg.classList.remove("show");
        loadingMsg.classList.add("show");
        searchBtn.disabled = true;

        try {
          const res = await fetch("/api/dictionary", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ word, language }),
          });
          const data = await res.json();
          loadingMsg.classList.remove("show");
          searchBtn.disabled = false;

          if (!res.ok || !data.word) {
            errorMsg.textContent = data.error || "Something went wrong.";
            errorMsg.classList.add("show");
            return;
          }

          lastLookup = { word: data.word, language };
          document.getElementById("resultWord").textContent = data.word;
          document.getElementById("resultPos").textContent =
            data.partOfSpeech || "";
          document.getElementById("resultPos").style.display = data.partOfSpeech
            ? "inline-block"
            : "none";
          document.getElementById("resultDefinition").textContent =
            data.definition;

          const exampleBox = document.getElementById("exampleBox");
          if (data.exampleSentence) {
            exampleBox.style.display = "block";
            document.getElementById("exampleOriginal").textContent =
              data.exampleSentence;
            document.getElementById("exampleTranslation").textContent =
              data.exampleTranslation || "";
          } else {
            exampleBox.style.display = "none";
          }

          const notesEl = document.getElementById("resultNotes");
          if (data.notes) {
            notesEl.style.display = "block";
            notesEl.textContent = "Note: " + data.notes;
          } else {
            notesEl.style.display = "none";
          }

          resultCard.classList.add("show");
          saveRecent(data.word, language);
        } catch (err) {
          loadingMsg.classList.remove("show");
          searchBtn.disabled = false;
          errorMsg.textContent = "Could not reach the server. Try again.";
          errorMsg.classList.add("show");
        }
      }

      searchBtn.addEventListener("click", search);
      wordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") search();
      });

      playBtn.addEventListener("click", async () => {
        if (!lastLookup) return;
        playBtn.classList.add("loading");
        try {
          const res = await fetch("/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: lastLookup.word,
              level: "B1",
              language: lastLookup.language,
            }),
          });
          const data = await res.json();
          if (data.audio) {
            const audio = new Audio("data:audio/mp3;base64," + data.audio);
            audio.onended = () => playBtn.classList.remove("loading");
            audio.play();
          } else {
            playBtn.classList.remove("loading");
          }
        } catch (err) {
          playBtn.classList.remove("loading");
        }
      });

      renderRecent();
    </script>
  </body>
</html>
