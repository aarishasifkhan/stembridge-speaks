<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <meta name="robots" content="noindex, follow" />
    <title>Certificate Verification — STEMBridge Speaks</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #1b4332;
        --forest-dark: #12301f;
        --gold: #e8a33d;
        --cream: #fbf7ee;
        --sage: #e3eae0;
        --ink: #22281e;
        --brick: #8c4a3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "Work Sans", sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 6vw;
        border-bottom: 1px solid rgba(27, 67, 50, 0.1);
      }
      .logo {
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 19px;
        color: var(--forest);
        text-decoration: none;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 60px 6vw 90px;
      }
      .icon {
        font-size: 40px;
        text-align: center;
        margin-bottom: 10px;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: 24px;
        text-align: center;
        margin: 0 0 30px;
        color: var(--forest-dark);
      }
      .card {
        background: white;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 6px 20px rgba(18, 48, 31, 0.06);
      }
      .card.valid {
        border-top: 4px solid var(--forest);
      }
      .card.invalid {
        border-top: 4px solid var(--brick);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--sage);
        font-size: 14.5px;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row .k {
        color: #6b7062;
      }
      .row .v {
        font-weight: 600;
        color: var(--ink);
        text-align: right;
      }
      .status-line {
        text-align: center;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 18px;
      }
      .status-line.valid {
        color: var(--forest);
      }
      .status-line.invalid {
        color: var(--brick);
      }
      .footer-note {
        text-align: center;
        font-size: 12.5px;
        color: #6b7062;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo">STEMBridge Speaks</a>
    </header>

    <main>
      <div class="icon" id="icon">🔎</div>
      <h1>Certificate Verification</h1>

      <div id="result">
        <p style="text-align: center; color: #6b7062">Checking credential…</p>
      </div>

      <p class="footer-note">
        This page confirms whether a credential ID was issued by STEMBridge
        Speaks. No personal account information beyond the recipient's name is
        shown.
      </p>
    </main>

    <script>
      // Safe against XSS by construction: every dynamic value below is
      // written with textContent, never innerHTML/template strings, since
      // recipientName is a free-text value the certificate holder chose.
      function row(k, v) {
        const r = document.createElement("div");
        r.className = "row";
        const kEl = document.createElement("div");
        kEl.className = "k";
        kEl.textContent = k;
        const vEl = document.createElement("div");
        vEl.className = "v";
        vEl.textContent = v;
        r.appendChild(kEl);
        r.appendChild(vEl);
        return r;
      }

      (async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const resultEl = document.getElementById("result");
        const iconEl = document.getElementById("icon");
        resultEl.innerHTML = "";

        if (!id) {
          iconEl.textContent = "❓";
          const p = document.createElement("p");
          p.style.textAlign = "center";
          p.style.color = "#6b7062";
          p.textContent =
            "No credential ID was provided. Check the link and try again.";
          resultEl.appendChild(p);
          return;
        }

        try {
          const res = await fetch("/api/verify/" + encodeURIComponent(id));
          const data = await res.json();

          if (!res.ok || !data.valid) {
            iconEl.textContent = "✖️";
            const status = document.createElement("div");
            status.className = "status-line invalid";
            status.textContent = "This credential could not be verified.";
            resultEl.appendChild(status);
            const card = document.createElement("div");
            card.className = "card invalid";
            const p = document.createElement("p");
            p.style.margin = "0";
            p.style.fontSize = "14px";
            p.style.color = "#6b7062";
            p.textContent =
              "No STEMBridge Speaks certificate matches this ID, or it has been revoked.";
            card.appendChild(p);
            resultEl.appendChild(card);
            return;
          }

          iconEl.textContent = "✅";
          const status = document.createElement("div");
          status.className = "status-line valid";
          status.textContent = "This is a valid STEMBridge Speaks certificate.";
          resultEl.appendChild(status);

          const card = document.createElement("div");
          card.className = "card valid";
          card.appendChild(row("Recipient", data.recipientName));
          card.appendChild(row("Course", data.language + " Language Course"));
          card.appendChild(row("Issuer", data.issuer || "STEMBridge Speaks"));
          card.appendChild(
            row(
              "Issued",
              new Date(data.issuedAt).toLocaleDateString(undefined, {
                year: "numeric",
                month: "long",
                day: "numeric",
              }),
            ),
          );
          resultEl.appendChild(card);
        } catch (err) {
          iconEl.textContent = "⚠️";
          const p = document.createElement("p");
          p.style.textAlign = "center";
          p.style.color = "#6b7062";
          p.textContent =
            "Something went wrong while checking this credential.";
          resultEl.appendChild(p);
        }
      })();
    </script>
  </body>
</html>
